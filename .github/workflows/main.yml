name: Build Wardrobe Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q WardrobeTracker-v1.0.zip -d project

      - name: Find Android project
        run: |
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("${{ env.PROJECT_DIR }}") / "app" / "build.gradle.kts"
          s = p.read_text()

          s = s.replace(
              'android { namespace = "com.example.wardrobetacker"; compileSdk = 35',
              '''android {
              namespace = "com.example.wardrobetacker"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }'''
          )

          p.write_text(s)
          PY
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wardrobe-Tracker-APK
          path: "**/build/outputs/apk/debug/*.apk"
