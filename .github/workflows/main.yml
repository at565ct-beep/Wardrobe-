name: Build Wardrobe Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q WardrobeTracker-v1.0.zip -d project

      - name: Find Android project
        run: |
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wardrobe-Tracker-APK
          path: "**/build/outputs/apk/debug/*.apk"
